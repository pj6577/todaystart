name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/build-landing.cjs"
      - "src/style.css"
      - "assets/icon.svg"
      - "assets/platforms/*-symbol.png"
      - "assets/branding/SUIT-Variable.woff2"
      - "assets/branding/SUIT-OFL.txt"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/build-landing.cjs"
      - "src/style.css"
      - "assets/icon.svg"
      - "assets/platforms/*-symbol.png"
      - "assets/branding/SUIT-Variable.woff2"
      - "assets/branding/SUIT-OFL.txt"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build static landing page
        run: |
          node --check landing/theme.js
          node --check landing/motion.js
          node scripts/build-landing.cjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/landing
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
